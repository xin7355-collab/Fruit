name: 更新全台批發行情

# 拍賣在清晨，各市場資料陸續上線 → 台灣 05:00–12:00 每小時跑一次（增量版只抓近 14 天，每次約 1～2 分鐘），
# 14:00 再補一次。每月第一次執行自動整段重抓 2 年（校正事後更正）。index.json 的 seen 會記錄每天資料最早幾點出現，
# 之後可依實測縮減時段。手動觸發可選「整段重抓」與「5 年封存回填的時間預算」。
on:
  schedule:
    - cron: '0 21-23,0-4 * * *'   # 台灣 05:00–12:00 每小時
    - cron: '0 6 * * *'           # 14:00 台灣（補抓晚盤/漏抓）
  workflow_dispatch:
    inputs:
      full:
        description: 整段重抓 2 年（平常每月第一次執行會自動整段）
        type: boolean
        default: false
      backfill_minutes:
        description: 5 年封存回填的時間預算（分鐘；排程預設 20，第一次補完可給 150）
        default: '20'

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 200   # 手動回填可給 150 分鐘預算；腳本自己會在預算內收尾，這裡只是卡住時的上限
    steps:
      # 操作 main（GitHub Pages 服務的分支）
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false   # 權杖不留在 .git/config；只在最後推送那步臨時帶入

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依
        run: pip install -r scripts/requirements.txt

      - name: 抓取全台批發行情（農業部公開資料，免金鑰；近 2 年）
        env:
          BACKFILL: ${{ inputs.backfill_minutes || '20' }}
          FULL: ${{ inputs.full && '--full' || '' }}
        run: python3 scripts/fetch_prices.py --days 730 --backfill-minutes "$BACKFILL" $FULL || echo "行情抓取失敗，保留既有資料，前端仍可讀舊值/退回示範"

      - name: 抓取各縣市每公頃單產（農業部生產概況，免金鑰；年更新）
        run: python3 scripts/fetch_yield.py || echo "單產抓取失敗，保留既有 yield_index.json，前端退回內建估算值"

      - name: 抓取產地價格（農會查報的全台當日平均價，免金鑰；失敗保留舊檔）
        run: python3 scripts/fetch_origin.py || echo "產地價格這次沒抓到，保留舊檔（下次再試）"

      - name: 提交更新的行情 JSON（供前端 index.html 讀取）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add prices_index.json prices yield_index.json yield_debug.json $(ls origin.json 2>/dev/null)
          if git diff --staged --quiet; then
            echo "行情無變更，略過提交。"
          else
            git commit -m "chore(data): 更新全台批發行情 [skip ci]"
            # push 前 rebase 重試，避免與 update-data / 部署競爭 main 造成非快進被拒
            ok=0
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then ok=1; break; fi
              echo "push 被拒，rebase 後重試（第 $i 次）"
              git fetch origin main
              git rebase origin/main || git rebase --abort
              sleep $((i * 3))
            done
            [ "$ok" = 1 ] || { echo "::error::push 連續失敗"; exit 1; }
          fi

      - name: 還原行情推播去重狀態
        uses: actions/cache@v4
        with:
          path: notify_price_state.json
          key: notify-price-state-${{ github.run_id }}
          restore-keys: |
            notify-price-state-

      # 放在提交之後：推播壞掉（例如 LINE token 錯）會亮紅燈通知你，但不影響行情已經更新。
      # 關注品項用 repo 的 Variables 設定（Settings → Secrets and variables → Actions → Variables）：
      #   NOTIFY_PRICE_CROPS＝甘藍,小白菜（逗號分隔）、NOTIFY_PRICE_MARKET＝西螺；沒設就安靜略過。
      - name: 行情推播（關注品項偏貴／偏便宜）
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          NOTIFY_PRICE_MARKET: ${{ vars.NOTIFY_PRICE_MARKET }}
          NOTIFY_PRICE_CROPS: ${{ vars.NOTIFY_PRICE_CROPS }}
        run: python3 scripts/notify.py --prices --state notify_price_state.json
