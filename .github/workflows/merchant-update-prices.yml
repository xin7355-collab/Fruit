name: "精準進貨｜更新全台批發行情"

# 拍賣在清晨，各市場資料陸續上線 → 台灣 05:00–12:00 每小時跑一次（增量版只抓近 14 天，每次約 1～2 分鐘），
# 14:00 再補一次。每月第一次執行自動整段重抓 2 年（校正事後更正）。index.json 的 seen 會記錄每天資料最早幾點出現，
# 之後可依實測縮減時段。手動觸發可選「整段重抓」與「（精準進貨不封存）」。
on:
  schedule:
    - cron: '30 21-23,0-4 * * *'  # 台灣 05:30–12:30 每小時（與精準務農錯開半小時）
    - cron: '30 6 * * *'          # 14:30 台灣
  workflow_dispatch:
    inputs:
      full:
        description: 整段重抓 2 年
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: merchant-update-prices
  cancel-in-progress: false

defaults:
  run:
    working-directory: merchant

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # 卡住時自動中止（預設 6 小時會白燒分鐘數）
    steps:
      # 操作 main（GitHub Pages 服務的分支）
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false   # 權杖不留在 .git/config；只在最後推送那步臨時帶入

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依
        run: pip install -r scripts/requirements.txt

      - name: 抓取全台批發行情（農業部公開資料，免金鑰；近 2 年）
        env:
          FULL: ${{ inputs.full && '--full' || '' }}
        run: python3 scripts/fetch_prices.py --days 730 $FULL || echo "行情抓取失敗，保留既有資料，前端仍可讀舊值/退回示範"

      - name: 抓取臺北市零售參考價（每月；失敗保留舊檔）
        run: python3 scripts/fetch_retail.py || echo "零售資料這次沒抓到，保留舊檔（下次再試）"

      - name: 提交更新的行情 JSON（供前端 index.html 讀取）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add prices_index.json prices $(ls retail.json 2>/dev/null)
          if git diff --staged --quiet; then
            echo "行情無變更，略過提交。"
          else
            git commit -m "chore(data): 更新全台批發行情 [skip ci]"
            # push 前 rebase 重試，避免與 update-data / 部署競爭 main 造成非快進被拒
            ok=0
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then ok=1; break; fi
              echo "push 被拒，rebase 後重試（第 $i 次）"
              git fetch origin main
              git rebase origin/main || git rebase --abort
              sleep $((i * 3))
            done
            [ "$ok" = 1 ] || { echo "::error::push 連續失敗"; exit 1; }
          fi
