name: 探測行情 API 欄位（一次性）

# 手動觸發：抓一個市場「不帶作物名」的原始回應，dump 欄位/樣本到 prices_probe.json，
# 用來決定「逐市場抓全部＋分類」的做法（看 API 有沒有種類欄位）。與行情排程互不阻塞。
on:
  workflow_dispatch:
    inputs:
      market:
        description: 市場短名（如 台北一 / 台中 / 西螺）
        required: true
        default: 台北一

permissions:
  contents: write

concurrency:
  group: probe

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 卡住時自動中止（預設 6 小時會白燒分鐘數）
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false   # 權杖不留在 .git/config；只在最後推送那步臨時帶入
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: 探測
        env:
          MARKET: ${{ inputs.market }}
        run: python3 scripts/fetch_prices.py --probe "$MARKET"
      - name: 提交探測結果
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add prices_probe.json
          git diff --staged --quiet || { git commit -m "chore: 行情 API 欄位探測 [skip ci]"; \
            for i in 1 2 3 4 5; do git push origin HEAD:main && break; git fetch origin main; git rebase origin/main || git rebase --abort; sleep $((i*3)); done; }
